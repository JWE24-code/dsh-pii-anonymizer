# SonarCloud analysis config. The scan runs from .github/workflows/ci.yml.
sonar.projectKey=JWE24-code_dsh-pii-anonymizer
sonar.organization=jwe24-code

sonar.sourceEncoding=UTF-8

# The plugin ships src/; the unit tests live in test/. tools/ is dev-only
# end-to-end machinery (a mock provider and a profile registrar) that never
# reaches npm, so it is left out of the analysis.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*.test.mjs
sonar.exclusions=node_modules/**,tools/**
