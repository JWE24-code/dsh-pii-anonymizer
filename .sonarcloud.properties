# SonarQube Cloud Automatic Analysis configuration.
#
# This project is analyzed by SonarCloud Automatic Analysis (see
# docs/RELEASING.md and .github/workflows/ci.yml): there is no CI scanner and
# no SONAR_TOKEN. Automatic Analysis reads THIS file, not
# sonar-project.properties — the latter is only honored by a CI-based
# `sonar-scanner` run. Keep both so switching analysis method never loses
# configuration.
#
# Only properties supported by Automatic Analysis belong here; CI-only keys
# (sonar.sources, sonar.tests, sonar.javascript.lcov.reportPaths) are
# deliberately absent.

sonar.sourceEncoding=UTF-8

# tools/ is dev-only end-to-end machinery that never reaches npm, so it stays
# out of the analysis — the same scope declared in sonar-project.properties.
sonar.exclusions=node_modules/**,tools/**
