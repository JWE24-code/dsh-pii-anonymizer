# SonarCloud config for a CI-based `sonar-scanner` run (requires SONAR_TOKEN).
# This project currently uses tokenless Automatic Analysis, which reads
# .sonarcloud.properties instead; keep the scope in both files in sync.
sonar.projectKey=JWE24-code_dsh-pii-anonymizer
sonar.organization=jwe24-code

sonar.sourceEncoding=UTF-8

# The plugin ships src/; the unit tests live in test/. tools/ is dev-only
# end-to-end machinery (a mock provider and a profile registrar) that never
# reaches npm, so it is left out of the analysis.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*.test.mjs
sonar.exclusions=node_modules/**,tools/**

# Coverage comes from Node's built-in lcov reporter (see .github/workflows/ci.yml).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# src/index.mjs is the Cordis entry point: it imports the Harness packages
# (@deepseek-ai/schemastery, @deepseek-ai/dsh-llm), which the unit-test job
# does not install. Its behaviour is covered by the end-to-end test in tools/,
# so it is excluded from the unit-coverage condition rather than reported as 0%.
sonar.coverage.exclusions=src/index.mjs
