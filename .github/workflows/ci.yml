name: CI

# SonarCloud analysis runs as Automatic Analysis on the SonarCloud side (the
# project is public), so it needs no token and no step here. Read the result
# with `npm run sonar:issues`.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The unit tests import only the dependency-free detector and
      # pseudonymizer modules, so no install is needed to run them.
      - run: node --test
