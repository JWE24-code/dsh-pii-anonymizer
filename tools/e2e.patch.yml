# End-to-end test overlay: route the deepseek adapter at a local mock and load
# the PII anonymizer. Applied with --patch, never written to any profile.
#
# The plugin is loaded by package name, so the checkout must be resolvable from
# the scratch home first (see README, "End-to-end test"):
#   ln -s "$PWD" "$DSH_HOME/profiles/node_modules/dsh-pii-anonymizer"
- id: llm-deepseek
  config:
    baseURL: 'http://127.0.0.1:8787'
    apiKeyEnv: 'DSH_E2E_KEY'

- insert:
    - id: pii-anonymizer
      name: 'dsh-pii-anonymizer'
      config:
        enabled: true
        notify: true
        debug: true
